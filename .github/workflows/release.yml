# Builds this fork's installable package (skiff-X.Y.Z-suffix.fwsc) on GitHub, with the community's shared FM-1 builder
# (zvenson/fm1-build, pinned at its reviewed tag v1): JieLi's Linux toolchain and the AC79 SDK, then this repository's
# own ./build.sh --release.
#
#   Push a tag v1.3.3-hold (X.Y.Z-suffix, one digit each, the suffix letters and digits only: tools/build.py --release)
#   -> a GitHub Release of that tag with the .fwsc and SHA256SUMS attached.
#   A push to main, or Actions > release > Run workflow -> the same build as a downloadable artifact ("packages"),
#   version 1.3.3-notes.
#
# The tests (tests/run_tests.sh) run after the build and are reported, but do not hold the package back.
#
# Rev 1 (fork of Skiff 1.3.3, SLIDE HOLD): first version.
# Rev 2: also builds on a push to main (tag pushes from the Claude session were refused); non-tag builds are
#        version 1.3.3-hold, not 1.3.3-dev.
# Rev 6: the tests' failures to annotations.
# Rev 5: FELUCCA_CDC=0 (no USB serial console: the flash region was full).
# Rev 4: the build's output to annotations (sizes; its end on a failure).
# Rev 3 (PERNOTE): non-tag builds are version 1.3.3-notes; a push to main also publishes the installer and the editor
#        to GitHub Pages (job `pages`, tools/fork_site.py): https://seattleuser0.github.io/skiff/ once Pages is set to
#        "GitHub Actions" in the repository's Settings > Pages.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: false
      build: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
        python3 -m pip install fonttools numpy
        if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v=1.3.3-notes; fi
        # (rev 4) the build's output to annotations (they show on the run's page): its end on a failure, its size
        # lines (RAM .data+.bss, pool, RAM code + .ramx) either way
        # (rev 5) without the USB serial console (FELUCCA_CDC=0, a developer tool): Skiff 1.3.3 nearly fills the app's
        # flash region, and the per-note modes need about 3 KB more
        export FELUCCA_CDC=0
        ok=0; ./build.sh --release "$v" > build.log 2>&1 || ok=1
        note=$(grep -E "RAM|pool|image|error|Error|failed|overflow" build.log | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
        echo "::notice title=build sizes::$note"
        if [ "$ok" != 0 ]; then
          msg=$(tail -80 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
          echo "::error title=build failed::$msg"
          exit 1
        fi
      packages: build/skiff-*.fwsc
      # (rev 6) the tests' failures to annotations (the run's page)
      test: |
        [ -f build/felucca.fwsc ] || cp "$(ls build/skiff-*.fwsc | head -1)" build/felucca.fwsc   # (a release build's name)
        ok=0; sh tests/run_tests.sh > test.log 2>&1 || ok=1
        if [ "$ok" != 0 ]; then
          msg=$( { grep -inE "fail|abort|segmentation|assert|not found|cannot|traceback|exception" test.log | grep -v " ok$" | head -40; echo ----; tail -25 test.log; } | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
          echo "::error title=tests failed::$msg"
          exit 1
        fi
  pages:                                         # (rev 3) the installer and the editor of this build, on GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: pkg
      - name: The site
        run: python3 tools/fork_site.py "$(ls pkg/build/skiff-*.fwsc | head -1)" 1.3.3-notes site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
